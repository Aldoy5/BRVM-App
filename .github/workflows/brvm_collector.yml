name: Collecte et Synchronisation Cotations BRVM

on:
  # Collecte planifiée désactivée : la collecte et la mise à jour de l'historique Firestore sont gérées directement par l'application
  # schedule:
  #   - cron: '3,18,33,48 9-15 * * 1-5'
  workflow_dispatch: # Déclenchement manuel à la demande depuis GitHub si besoin ponctuel

# Empêche les exécutions concurrentes du même workflow
concurrency:
  group: brvm-collector
  cancel-in-progress: false

jobs:
  collect_and_sync:
    name: Scraper & Synchro Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Installer les dépendances
        working-directory: functions
        run: npm ci || npm install

      - name: Exécuter la collecte et mise à jour Firestore
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync_firestore.js

      - name: Enregistrer les nouvelles cotations dans le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/brvm_cours.json
          if git diff --staged --quiet; then
            echo "Aucune modification des cotations à valider."
          else
            git commit -m "chore(cotations): actualisation automatique des cours BRVM"
            git pull --rebase origin main
            git push
          fi
