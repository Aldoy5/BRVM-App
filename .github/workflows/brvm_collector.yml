name: Collecte et Synchronisation Cotations BRVM

on:
  schedule:
    # Du lundi au vendredi, toutes les 15 minutes entre 09h00 et 15h00 GMT (horaires séance BRVM)
    - cron: '*/15 9-15 * * 1-5'
  workflow_dispatch: # Déclenchement manuel à la demande depuis GitHub

jobs:
  collect_and_sync:
    name: Scraper & Synchro Firestore
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Installer les dépendances
        working-directory: functions
        run: npm install

      - name: Exécuter la collecte et mise à jour Firestore
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync_firestore.js

      - name: Enregistrer les nouvelles cotations dans le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add functions/brvm_cours.json
          if git diff --staged --quiet; then
            echo "Aucune modification des cotations à valider."
          else
            git commit -m "chore(cotations): actualisation automatique des cours BRVM [skip ci]"
            git push
          fi
