name: Keepalive — Maintenir les workflows cron actifs

# GitHub désactive automatiquement les workflows cron sur les repos inactifs.
# Ce workflow crée une activité minimale chaque semaine pour éviter la désactivation.

on:
  schedule:
    # Chaque dimanche à 06h00 GMT
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  keepalive:
    name: Keepalive ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Maintenir les workflows actifs
        uses: actions/github-script@v7
        with:
          script: |
            // Lister les workflows du repo
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const wf of workflows.workflows) {
              if (wf.state === 'disabled_inactivity') {
                console.log(`Réactivation du workflow désactivé : ${wf.name} (id: ${wf.id})`);
                await github.rest.actions.enableWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf.id,
                });
              } else {
                console.log(`Workflow actif : ${wf.name} — état: ${wf.state}`);
              }
            }

            console.log('✅ Vérification terminée.');
